# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish NPM Package

on:
  release:
    types: [created]
  # Allows re-running a publish that failed for infrastructure reasons, without
  # having to delete and recreate the release.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to publish (e.g. v1.2.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      # - run: npm test
      - run: npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required for npm trusted publishing: Actions mints the OIDC token that
    # npm verifies in place of a long-lived NPM_ACCESS_TOKEN.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org/
          cache: npm
      # Node 22 bundles npm 10, which predates trusted publishing (needs 11.5.1+).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
